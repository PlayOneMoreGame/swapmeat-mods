name: validate

# Runs on every push to main, which only ever comes from the game's export. A red check means an export
# produced a pack the game's loader would refuse, and the log names the file and the rule.
on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate mod pack structure
        run: ./scripts/validate
